<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南大東村ネコ目撃情報アンケート</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3498db">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 10px; background-color: #f4f7f6; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); box-sizing: border-box; }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; font-size: 22px; }
    .notice-text { font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 15px; padding: 0 5px; }
    .form-group { margin-bottom: 25px; }
    label { font-weight: bold; display: block; margin-bottom: 8px; color: #34495e; font-size: 15px; }
    #map { height: 300px; width: 100%; border-radius: 8px; border: 1px solid #ddd; }
    .hidden { display: none; }
    input[type="text"], input[type="file"], select, input[type="date"], textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; font-family: inherit; }
    .sample-box { margin-top: 10px; margin-bottom: 12px; }
    .sample-img { max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid #ddd; display: block; margin: 0 auto; }
    .radio-group { padding: 5px 0; display: flex; flex-wrap: wrap; gap: 15px; }
    .radio-group label { display: inline-flex; align-items: center; font-weight: normal; margin-right: 0; cursor: pointer; font-size: 16px; }
    .radio-group input[type="radio"] { width: 22px; height: 22px; margin-right: 8px; cursor: pointer; }
    .btn-action { background-color: #3498db; color: white; padding: 12px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; margin-bottom: 12px; display: block; width: 100%; box-sizing: border-box; transition: background 0.2s; }
    .btn-sub { background-color: #95a5a6; margin-bottom: 5px; }
    #submitBtn { width: 100%; background-color: #2ecc71; color: white; padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; font-weight: bold; transition: background 0.2s; }
    #output { margin-top: 20px; text-align: center; font-weight: bold; font-size: 15px; color: #e67e22; line-height: 1.5; white-space: pre-wrap; }
    .required::after { content: " *"; color: #e74c3c; }
    
    /* アプリインストールバナー */
    #installBanner { background-color: #fff3cd; color: #856404; padding: 12px; text-align: center; border-radius: 8px; margin-bottom: 20px; font-weight: bold; border: 1px solid #ffeeba; font-size: 14px; }
    #installBtn { display: block; width: 100%; margin-top: 10px; background-color: #e67e22; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; }

    /* ネコの柄 選択UI用スタイル */
    .pattern-menu { border: 1px solid #ccc; border-radius: 6px; overflow: hidden; background: #fff; margin-bottom: 10px; }
    .pattern-item { padding: 12px 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; cursor: pointer; }
    .pattern-item:active { background-color: #f0f0f0; }
    .pattern-item:last-child { border-bottom: none; }
    .pattern-icon { font-size: 24px; margin-right: 10px; display: inline-block; width: 30px; text-align: center; }
    .pattern-check { width: 24px; color: #2ecc71; font-weight: bold; font-size: 18px; display: inline-block; }
    .tag-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .tag { background: #3498db; color: white; padding: 6px 10px; border-radius: 4px; font-size: 14px; display: inline-flex; align-items: center; }
    .tag-close { margin-left: 8px; cursor: pointer; font-weight: bold; background: rgba(0,0,0,0.2); border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
<div class="container">

  <div id="installBanner" class="hidden">
    <span id="installText"></span>
    <button id="installBtn" class="hidden">ホーム画面に追加する</button>
  </div>

  <h2>ネコ目撃情報アンケート</h2>
  
  <div class="notice-text">
    南大東村では、公衆衛生上の課題、ネコの福祉、村内の野生動物の保全を目的としてネコの適正飼養を推進する事業を実施しています。...<br>
    皆様のご協力をどうぞよろしくお願いいたします。
  </div>

  <form id="catForm" onsubmit="handleFormSubmit(event)">
    <input type="hidden" id="location" required>
    
    <div class="form-group">
      <label class="required">目撃場所</label>
      <button type="button" id="currentLocationBtn" class="btn-action" onclick="goToCurrentLocation()">現在地を取得する</button>
      <div id="map"></div>
      <p id="locationDisplay" style="color: #7f8c8d; font-size: 0.9em; margin-top: 8px;">場所が選択されていません</p>
    </div>

    <!-- 現在日時ボタン -->
    <div class="form-group">
      <label class="required">目撃日時</label>
      <button type="button" class="btn-action btn-sub" onclick="setNowDatetime()">現在日時をセットする</button>
      <div style="display: flex; gap: 10px;">
        <input type="date" id="dateInput" style="flex: 2;" required>
        <select id="hourInput" style="flex: 1;" required>
          <option value="">時頃</option>
          <option value="00">0時頃</option><option value="01">1時頃</option><option value="02">2時頃</option>
          <option value="03">3時頃</option><option value="04">4時頃</option><option value="05">5時頃</option>
          <option value="06">6時頃</option><option value="07">7時頃</option><option value="08">8時頃</option>
          <option value="09">9時頃</option><option value="10">10時頃</option><option value="11">11時頃</option>
          <option value="12">12時頃</option><option value="13">13時頃</option><option value="14">14時頃</option>
          <option value="15">15時頃</option><option value="16">16時頃</option><option value="17">17時頃</option>
          <option value="18">18時頃</option><option value="19">19時頃</option><option value="20">20時頃</option>
          <option value="21">21時頃</option><option value="22">22時頃</option><option value="23">23時頃</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="catCount" class="required">ネコの頭数</label>
      <select id="catCount" onchange="toggleCatDetail()" required>
        <option value="">選択してください</option>
        <option value="1頭">1頭</option><option value="2頭">2頭</option><option value="3頭以上">3頭以上</option><option value="親子">親子</option>
      </select>
      <div id="catCountNumGroup" class="hidden" style="margin-top: 15px;">
        <label for="catCountNum" class="required">具体的な頭数</label>
        <select id="catCountNum">
          <option value="">選択してください</option>
          <option value="3頭">3頭</option><option value="4頭">4頭</option><option value="5頭">5頭</option><option value="6頭以上">6頭以上</option>
        </select>
      </div>
      <div id="catDetailGroup" class="hidden" style="margin-top: 15px;">
        <label for="catCountDetail" class="required">頭数の詳細</label>
        <input type="text" id="catCountDetail" placeholder="例: 親1頭、子3頭 など">
      </div>
    </div>

    <div class="form-group">
      <label class="required">耳カットされている個体か</label>
      <div class="sample-box"><img class="sample-img" src="unnamed.png" alt=""></div>
      <div class="radio-group">
        <label><input type="radio" name="earCutRadio" value="はい" onchange="toggleEarCutDetail()" required> はい</label>
        <label><input type="radio" name="earCutRadio" value="いいえ" onchange="toggleEarCutDetail()"> いいえ</label>
        <label><input type="radio" name="earCutRadio" value="わからない" onchange="toggleEarCutDetail()"> わからない</label>
        <label><input type="radio" name="earCutRadio" value="その他" onchange="toggleEarCutDetail()"> その他</label>
      </div>
      <div id="earCutDetailGroup" class="hidden" style="margin-top: 15px;">
        <label for="earCutDetail" class="required">耳カットの状況の詳細</label>
        <input type="text" id="earCutDetail" placeholder="例: 3頭中1頭耳カットあり など">
      </div>
    </div>

    <!-- ネコの柄 階層・複数選択UI -->
    <div class="form-group">
      <label>ネコの柄（わかる範囲で・複数選択可）</label>
      <div id="selectedPatternTags" class="tag-container"></div>
      
      <div id="patternMenu" class="pattern-menu"></div>
      
      <div id="otherPatternContainer" class="hidden">
        <input type="text" id="patternOtherInput" placeholder="その他の柄を具体的に入力してください" oninput="updatePatternValue()">
      </div>
      <input type="hidden" id="hiddenCatPattern" name="catPattern">
    </div>

    <div class="form-group">
      <label for="photo">目撃写真（データがあれば添付してください）</label>
      <input type="file" id="photo" accept="image/*">
    </div>

    <!-- 備考欄 -->
    <div class="form-group">
      <label for="remarks">備考</label>
      <textarea id="remarks" rows="3" placeholder="その他、気づいたことなどがあればご記入ください"></textarea>
    </div>

    <button type="submit" id="submitBtn">目撃情報を送信する</button>
  </form>
  <div id="output"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ==========================================
  // PWA & 基本設定群
  // ==========================================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
  }

  const installBanner = document.getElementById('installBanner');
  const installText = document.getElementById('installText');
  const installBtn = document.getElementById('installBtn');
  let deferredPrompt;
  const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
  const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

  if (!isStandalone) {
    if (isIos) {
      installText.innerHTML = '💡 圏外でも使えるようにするには<br>Safari下部の「共有ボタン」から<br>「ホーム画面に追加」をタップしてください。';
      installBanner.classList.remove('hidden');
    } else {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault(); deferredPrompt = e;
        installText.innerHTML = '💡 圏外でも使えるように、アプリとしてインストールできます。';
        installBanner.classList.remove('hidden'); installBtn.classList.remove('hidden');
      });
      installBtn.addEventListener('click', async () => {
        installBanner.classList.add('hidden'); deferredPrompt.prompt();
        await deferredPrompt.userChoice; deferredPrompt = null;
      });
    }
  }

  // ==========================================
  // 目撃日時の現在時刻セット機能
  // ==========================================
  function setNowDatetime() {
    const now = new Date();
    const dStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    const hStr = String(now.getHours()).padStart(2, '0');
    document.getElementById('dateInput').value = dStr;
    document.getElementById('hourInput').value = hStr;
  }

  // ==========================================
  // 地図ロジック
  // ==========================================
  var map = L.map('map').setView([25.845, 131.23], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  var marker;
  map.on('click', function(e) { updateMarkerAndLocation(e.latlng); });

  function goToCurrentLocation() {
    if (!navigator.geolocation) { alert("位置情報に対応していません。"); return; }
    var locBtn = document.getElementById('currentLocationBtn');
    locBtn.disabled = true; locBtn.innerText = "取得中...";
    navigator.geolocation.getCurrentPosition(
      function(position) {
        var latlng = L.latLng(position.coords.latitude, position.coords.longitude);
        map.setView(latlng, 16); updateMarkerAndLocation(latlng);
        locBtn.disabled = false; locBtn.innerText = "現在地を取得する";
      },
      function() { alert("位置情報の取得に失敗しました。"); locBtn.disabled = false; locBtn.innerText = "現在地を取得する"; },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  function updateMarkerAndLocation(latlng) {
    var lat = latlng.lat.toFixed(6); var lng = latlng.lng.toFixed(6);
    if (marker) { marker.setLatLng(latlng); } else { marker = L.marker(latlng).addTo(map); }
    document.getElementById('location').value = lat + ", " + lng;
    document.getElementById('locationDisplay').innerText = "緯度 " + lat + " / 経度 " + lng;
  }

  function toggleCatDetail() {
    var val = document.getElementById('catCount').value;
    document.getElementById('catCountNumGroup').classList.toggle('hidden', val !== '3頭以上');
    document.getElementById('catDetailGroup').classList.toggle('hidden', val !== '親子');
  }

  function toggleEarCutDetail() {
    var val = document.querySelector('input[name="earCutRadio"]:checked')?.value;
    var detailGroup = document.getElementById('earCutDetailGroup');
    var detailInput = document.getElementById('earCutDetail');
    if (val === 'その他') { detailGroup.classList.remove('hidden'); detailInput.required = true; } 
    else { detailGroup.classList.add('hidden'); detailInput.required = false; detailInput.value = ''; }
  }

  // ==========================================
  // ネコの柄 選択ロジック（画像版）
  // ==========================================
  const patternCategories = {
    "虎柄": [ 
      { id: "キジトラ", icon: "<img src='kijitora.png' style='height:24px; vertical-align:middle;'>" }, 
      { id: "キジ白", icon: "<img src='kijisiro.png' style='height:24px; vertical-align:middle;'>" }, 
      { id: "サバトラ", icon: "<img src='sabatora.png' style='height:24px; vertical-align:middle;'>" }, 
      { id: "サバ白", icon: "<img src='sabasiro.png' style='height:24px; vertical-align:middle;'>" }, 
      { id: "茶トラ", icon: "<img src='tyatora.png' style='height:24px; vertical-align:middle;'>" }, 
      { id: "茶白", icon: "<img src='tyasiro.png' style='height:24px; vertical-align:middle;'>" } 
    ],
    "単色": [ 
      { id: "黒", icon: "<img src='kuro.png' style='height:24px; vertical-align:middle;'>" }, 
      { id: "白", icon: "<img src='siro.png' style='height:24px; vertical-align:middle;'>" }, 
      { id: "グレー", icon: "<img src='gray.png' style='height:24px; vertical-align:middle;'>" } 
    ],
    "混色": [ 
      { id: "黒白", icon: "<img src='kurosiro.png' style='height:24px; vertical-align:middle;'>" }, 
      { id: "白茶", icon: "<img src='sirotya.png' style='height:24px; vertical-align:middle;'>" }, 
      { id: "シャム系", icon: "<img src='syamu.png' style='height:24px; vertical-align:middle;'>" },
      { id: "グレー白", icon: "<img src='graysiro.png' style='height:24px; vertical-align:middle;'>" },
      { id: "サビ", icon: "<img src='sabi.png' style='height:24px; vertical-align:middle;'>" }
    ]
  };
  const standalonePatterns = [ 
    { id: "三毛", icon: "<img src='mike.png' style='height:24px; vertical-align:middle;'>" }, 
    { id: "その他", icon: "📝" } 
  ];

  let selectedPatterns = new Set();
  let currentPatternCategory = null;

  function renderPatternMenu() {
    const menu = document.getElementById('patternMenu');
    menu.innerHTML = '';

    if (currentPatternCategory) {
      // サブメニュー（戻るボタンあり）
      const backBtn = document.createElement('div');
      backBtn.className = 'pattern-item';
      backBtn.style.backgroundColor = '#f1f2f6';
      backBtn.innerHTML = '<strong>◀ 戻る</strong>';
      backBtn.onclick = () => { currentPatternCategory = null; renderPatternMenu(); };
      menu.appendChild(backBtn);

      patternCategories[currentPatternCategory].forEach(item => {
        menu.appendChild(createPatternItem(item.id, item.icon));
      });
    } else {
      // メインメニュー
      Object.keys(patternCategories).forEach(cat => {
        const div = document.createElement('div');
        div.className = 'pattern-item';
        div.innerHTML = `<span class="pattern-check"></span><span class="pattern-icon">📁</span><span>${cat}</span><span style="margin-left:auto;">▶</span>`;
        div.onclick = () => { currentPatternCategory = cat; renderPatternMenu(); };
        menu.appendChild(div);
      });
      standalonePatterns.forEach(item => {
        menu.appendChild(createPatternItem(item.id, item.icon));
      });
    }
    updatePatternTags();
  }

  function createPatternItem(id, icon) {
    const div = document.createElement('div');
    div.className = 'pattern-item';
    const isSelected = selectedPatterns.has(id);
    div.innerHTML = `<span class="pattern-check">${isSelected ? '✓' : ''}</span><span class="pattern-icon">${icon}</span><span>${id}</span>`;
    div.onclick = () => {
      if (isSelected) selectedPatterns.delete(id); else selectedPatterns.add(id);
      if (id === 'その他') document.getElementById('otherPatternContainer').classList.toggle('hidden', !selectedPatterns.has('その他'));
      renderPatternMenu();
    };
    return div;
  }

  function updatePatternTags() {
    const container = document.getElementById('selectedPatternTags');
    container.innerHTML = '';
    selectedPatterns.forEach(id => {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.innerHTML = `${id} <span class="tag-close" onclick="removePattern('${id}')">×</span>`;
      container.appendChild(tag);
    });
    updatePatternValue();
  }

  function removePattern(id) {
    selectedPatterns.delete(id);
    if (id === 'その他') document.getElementById('otherPatternContainer').classList.add('hidden');
    renderPatternMenu();
  }

  function updatePatternValue() {
    let vals = Array.from(selectedPatterns);
    if (vals.includes('その他')) {
      const otherVal = document.getElementById('patternOtherInput').value;
      vals = vals.map(v => v === 'その他' ? (otherVal ? `その他(${otherVal})` : 'その他') : v);
    }
    document.getElementById('hiddenCatPattern').value = vals.join(', ');
  }

  renderPatternMenu(); // 初期化実行

  // ==========================================
  // IndexedDB & 送信処理
  // ==========================================
  const dbName = "CatReportDB"; const storeName = "offlineReports";

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(dbName, 1);
      request.onupgradeneeded = (e) => { const db = e.target.result; if (!db.objectStoreNames.contains(storeName)) db.createObjectStore(storeName, { autoIncrement: true }); };
      request.onsuccess = (e) => resolve(e.target.result); request.onerror = (e) => reject(e.target.error);
    });
  }
  async function saveToIndexedDB(data) { const db = await openDB(); const tx = db.transaction(storeName, "readwrite"); tx.objectStore(storeName).add(data); return tx.complete; }
  async function getFromIndexedDB() { const db = await openDB(); return new Promise((resolve, reject) => { const tx = db.transaction(storeName, "readonly"); const req = tx.objectStore(storeName).getAllKeys(); const valReq = tx.objectStore(storeName).getAll(); tx.oncomplete = () => resolve(req.result.map((key, i) => ({ key: key, data: valReq.result[i] }))); tx.onerror = () => reject(tx.error); }); }
  async function deleteFromIndexedDB(key) { const db = await openDB(); const tx = db.transaction(storeName, "readwrite"); tx.objectStore(storeName).delete(key); }

  const gasURL = "https://script.google.com/macros/s/AKfycbwTHWtvb65Hh4dcGjqLlxw46capVcfXzGs3wQEtHpAapw55bgKgune_bJTkZRfemJkRQg/exec";

  async function sendDataToGAS(dataObj) {
    const params = new URLSearchParams(); for (const key in dataObj) { params.append(key, dataObj[key]); }
    return await fetch(gasURL, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: params });
  }

  async function processSubmission(dataObj) {
    var output = document.getElementById('output');
    if (navigator.onLine) {
      try {
        await sendDataToGAS(dataObj);
        output.innerText = "送信完了しました！ご協力ありがとうございます。"; output.style.color = "#2ecc71";
        resetFormUI();
      } catch (error) {
        await saveToIndexedDB(dataObj);
        output.innerText = "通信エラー。一時保存し、後で自動送信します。"; output.style.color = "#e67e22";
      }
    } else {
      await saveToIndexedDB(dataObj);
      output.innerText = "オフラインのため端末に保存しました。\n電波回復時に自動送信されます。"; output.style.color = "#e67e22";
      resetFormUI();
    }
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').innerText = "目撃情報を送信する";
  }

  function resetFormUI() {
    document.getElementById("catForm").reset();
    if(marker) map.removeLayer(marker); marker = null;
    document.getElementById('locationDisplay').innerText = "場所が選択されていません";
    selectedPatterns.clear(); renderPatternMenu(); document.getElementById('otherPatternContainer').classList.add('hidden');
  }

  function handleFormSubmit(e) {
    e.preventDefault();
    if(!document.getElementById('location').value) { alert("地図上で場所を選択してください。"); return; }
    
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('submitBtn').innerText = "処理中...";
    document.getElementById('output').innerText = "データを処理中です...";
    
    var dataObj = {
      location: document.getElementById('location').value,
      datetime: document.getElementById('dateInput').value + 'T' + document.getElementById('hourInput').value + ':00',
      catCountResult: document.getElementById('catCount').value === '3頭以上' ? document.getElementById('catCountNum').value : (document.getElementById('catCount').value === '親子' ? document.getElementById('catCountDetail').value : document.getElementById('catCount').value),
      earCut: document.querySelector('input[name="earCutRadio"]:checked')?.value === 'その他' ? document.getElementById('earCutDetail').value : (document.querySelector('input[name="earCutRadio"]:checked')?.value || ""),
      catPattern: document.getElementById('hiddenCatPattern').value,
      remarks: document.getElementById('remarks').value, 
      photoData: "", photoName: ""
    };
    
    var file = document.getElementById('photo').files[0];
    if (file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var MAX_WIDTH = 800, MAX_HEIGHT = 800;
          var width = img.width, height = img.height;
          if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } }
          else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          dataObj.photoData = canvas.toDataURL('image/jpeg', 0.6);
          dataObj.photoName = file.name.split('.')[0] + '.jpg';
          processSubmission(dataObj);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    } else { processSubmission(dataObj); }
  }

  window.addEventListener('online', async () => {
    const savedData = await getFromIndexedDB();
    if (savedData.length > 0) {
      document.getElementById('output').innerText = "保存データをバックグラウンドで送信中...";
      for (const item of savedData) {
        try { await sendDataToGAS(item.data); await deleteFromIndexedDB(item.key); } 
        catch (e) { console.error("同期失敗", e); }
      }
      document.getElementById('output').innerText = "オフライン保存データの送信が完了しました！";
      document.getElementById('output').style.color = "#2ecc71";
    }
  });
</script>
</body>
</html>
